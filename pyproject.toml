[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicert"
version = "0.1.0"
description = "Real-time voice AI agent framework: frame pipeline, barge-in interruption, strict Sales/Assistant/NPC profiles. Zero-dependency asyncio core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raph", email = "raphsoundmix@gmail.com" }]
keywords = ["voice", "ai", "realtime", "asyncio", "vad", "barge-in", "stt", "tts", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Ядро — только stdlib. Всё тяжёлое (WebRTC, ONNX, провайдеры) — опциональные extras.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11"]
webrtc = ["aiortc>=1.9"]
vad = ["onnxruntime>=1.18", "numpy>=1.26"]
providers = ["httpx>=0.27", "websockets>=13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/voicert"]
