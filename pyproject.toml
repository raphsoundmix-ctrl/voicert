[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicert"
version = "0.1.0"
description = "Real-time, interruptible voice for game NPCs: one character asset streamed into Unity (FMOD-native target) from a zero-dependency asyncio core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Raph", email = "raphsoundmix@gmail.com" }]
keywords = ["npc", "game", "unity", "fmod", "dialogue", "voice", "tts", "stt", "llm", "barge-in", "asyncio", "realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Ядро — только stdlib. Всё тяжёлое (WebRTC, ONNX, провайдеры) — опциональные extras.
dependencies = []

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0", "numpy>=1.24"]
local-llm = ["httpx>=0.27"]
local-tts = ["sherpa-onnx>=1.10", "numpy>=1.24"]
local = ["faster-whisper>=1.0", "httpx>=0.27", "sherpa-onnx>=1.10", "numpy>=1.24"]
# CUDA 12 runtime DLLs for Whisper (CTranslate2) and the sherpa-onnx CUDA wheel on Windows.
# The sherpa-onnx CUDA wheel itself is not on PyPI — see docs/local-stack.md.
cuda = [
    "nvidia-cuda-runtime-cu12>=12.4", "nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9",
    "nvidia-cufft-cu12>=11", "nvidia-curand-cu12>=10", "nvidia-cuda-nvrtc-cu12>=12.4",
]
bench = ["psutil>=5.9"]  # examples/resmon.py and run_local_npc.py's foreground QoS
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "types-psutil"]
webrtc = ["aiortc>=1.9"]
vad = ["onnxruntime>=1.18", "numpy>=1.26"]
providers = ["httpx>=0.27", "websockets>=13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Runtime support stays >=3.11 (see requires-python). The type-check target is 3.12
# because numpy >= 2.3 ships stubs using the PEP 695 `type` statement, which mypy
# refuses to parse under a 3.11 target even with follow_imports = "skip".
python_version = "3.12"
strict = true
files = ["src/voicert", "tools"]

# Optional local-provider runtimes: installed via the `local*` extras, absent
# in the default dev environment. Each import sits inside a try/except that
# raises a readable message, so a missing stub here is expected, not a defect.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "sherpa_onnx.*", "numpy.*", "httpx.*"]
ignore_missing_imports = true
